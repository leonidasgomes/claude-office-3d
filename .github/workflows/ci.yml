name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dependência opcional dos alertas (Web Push)
        run: python -m pip install cryptography
      - name: Sintaxe e varredura de vazamento
        run: python ferramentas/verificar.py
      - name: SDD em dia com o código (rotas, tabelas, scripts e flags, chaves do config)
        run: python ferramentas/verificar_docs.py
      - name: Instalação silenciosa (instala, repete sem duplicar, desinstala)
        run: python ferramentas/testar_instalacao.py
      - name: Alertas (detector, Web Push cifrado, VAPID, cota)
        run: python -W error ferramentas/testar_alertas.py
      - name: Filtro de origem do acesso pelo celular (rede_tailscale)
        run: python -W error ferramentas/testar_rede.py
      - name: Saúde do time e orçamento de atenção (duplicados, círculos, PR parado, push de resumo)
        run: python -W error ferramentas/testar_saude.py
      - name: Hook do escritório (✔/✖ dos comandos, PostToolUseFailure)
        run: python -W error ferramentas/testar_registrar_evento.py
      - name: Replay do dia (GET /eventos?de=&ate=)
        run: python -W error ferramentas/testar_eventos.py
      - name: Triagem das sugestões dos bots (itens já na caixa, teto de tentativas)
        run: python -W error ferramentas/testar_sugestoes_triagem.py
      - name: Build do pacote
        run: python ferramentas/build.py
