name: Linux gate isolation (experimental)

on:
  pull_request:
    paths:
      - '.github/workflows/gate-linux.yml'
      - 'ferramentas/gate_linux/**'
      - 'gates_projeto.py'
      - 'ferramentas/testar_gates_projeto.py'

permissions:
  contents: read

concurrency:
  group: gate-linux-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolation:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact official CLI into ephemeral directory
        run: |
          mkdir -p "$RUNNER_TEMP/gate-runtime"
          cp ferramentas/gate_linux/package.json ferramentas/gate_linux/package-lock.json "$RUNNER_TEMP/gate-runtime/"
          npm ci --prefix "$RUNNER_TEMP/gate-runtime" --ignore-scripts --no-audit --no-fund
      - name: Check fail-closed and supervisor regressions
        run: |
          python -W error ferramentas/gate_linux/test_adapter.py
          python -W error ferramentas/testar_gates_projeto.py
          python -W error ferramentas/testar_revisao_execucao.py
      - name: Prove native isolation without account or publication
        run: python -W error ferramentas/gate_linux/validate.py --codex "$RUNNER_TEMP/gate-runtime/node_modules/.bin/codex" --runtime-root "$RUNNER_TEMP/gate-runtime"
