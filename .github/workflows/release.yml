name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build (verificação + zip) e notas da versão
        run: |
          python ferramentas/build.py
          python ferramentas/notas_versao.py "${GITHUB_REF_NAME}" > NOTAS.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(--verify-tag)
          titulo="Office Multi-provider ${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
            titulo+=" — prévia pública (Codex e OpenCode)"
          fi
          # A publicação pela interface cria a tag e a pré-release antes deste job.
          # Só completa uma pré-release vazia, da tag exata; nunca substitui assets.
          if gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft,isPrerelease,assets > release-existente.json 2>/dev/null; then
            jq -e --arg tag "$GITHUB_REF_NAME" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == true and (.assets | length) == 0' \
              release-existente.json > /dev/null
            [[ "$GITHUB_REF_NAME" == *-* ]]
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
            [[ "$tag_sha" == "$GITHUB_SHA" ]]
            gh release upload "$GITHUB_REF_NAME" dist/office-multi-provider-*.zip dist/office-multi-provider-*.zip.sha256
            gh release edit "$GITHUB_REF_NAME" --title "$titulo" --notes-file NOTAS.md --prerelease --latest=false
          else
            gh release create "${GITHUB_REF_NAME}" dist/office-multi-provider-*.zip dist/office-multi-provider-*.zip.sha256 \
              --title "$titulo" --notes-file NOTAS.md "${flags[@]}"
          fi
