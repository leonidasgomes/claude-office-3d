name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Não interromper um upload em andamento nem competir pela mesma tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualificar:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publicar:
    needs: qualificar
    if: ${{ needs.qualificar.result == 'success' && needs.qualificar.outputs.tested_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CI_RESULTADO: ${{ needs.qualificar.result }}
      CI_SHA: ${{ needs.qualificar.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Conferir identidade da tag e commit qualificado
        run: python ferramentas/qualificar_release.py identidade
      - name: Build, conteúdo exato, checksum e API do ZIP extraído
        run: |
          python ferramentas/build.py
          python ferramentas/qualificar_release.py pacote
          python ferramentas/notas_versao.py "$GITHUB_REF_NAME" > NOTAS.md
      - name: Publicar sem substituir assets nem alterar Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ferramentas/qualificar_release.py publicar
